<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Container Lab — Learn Docker &amp; Kubernetes by Doing</title>
<style>
  :root{
    --ink:#0F1E2E; --bg:#EEF3F8; --card:#FFFFFF; --line:#E2E8F0;
    --text:#1E293B; --muted:#64748B;
    --docker:#2496ED; --k8s:#4257D6; --primary:#2563EB; --teal:#0EA5B7;
    --amber:#E8912A; --amber-soft:#FCF0DC; --green:#16A34A; --red:#DC2626;
    --term-bg:#0B1220; --term-text:#D7E0EA; --term-green:#4ADE80;
    --term-cyan:#38E1D6; --term-dim:#5B6b80; --term-red:#F87171; --term-amber:#FBBF24;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Fira Code",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden}
  button{font-family:inherit;cursor:pointer}

  /* ---------- top bar ---------- */
  header{
    height:60px;display:flex;align-items:center;gap:18px;padding:0 20px;
    background:linear-gradient(100deg,#0F1E2E,#15304d);color:#fff;flex:none;
    border-bottom:3px solid var(--teal);
  }
  .logo{display:flex;align-items:center;gap:11px}
  .logo svg{flex:none}
  .logo b{font-size:17px;font-weight:700;letter-spacing:.2px}
  .logo span{font-size:12px;color:#9FB3C8;display:block;margin-top:1px}
  .tracks{display:flex;gap:6px;margin-left:8px}
  .tracks button{
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#cfe0f0;
    padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;transition:.15s;
    display:flex;align-items:center;gap:7px;
  }
  .tracks button .dot{width:8px;height:8px;border-radius:50%}
  .tracks button[data-track="docker"] .dot{background:var(--docker)}
  .tracks button[data-track="k8s"] .dot{background:#8ea2ff}
  .tracks button:hover{background:rgba(255,255,255,.14);color:#fff}
  .tracks button.active{background:#fff;color:var(--ink)}
  .tracks button.active[data-track="k8s"] .dot{background:var(--k8s)}
  .progress-wrap{margin-left:auto;display:flex;align-items:center;gap:12px}
  .progress-wrap .txt{font-size:12px;color:#9FB3C8;text-align:right}
  .progress-wrap .txt b{color:#fff;font-size:15px}
  .ring{--p:0}
  .ring svg{transform:rotate(-90deg)}

  /* ---------- layout ---------- */
  .shell{display:grid;grid-template-columns:260px 1fr 520px;height:calc(100% - 60px)}
  @media(max-width:1180px){ .shell{grid-template-columns:230px 1fr;} .term-col{display:none} }

  /* sidebar */
  .side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
  .side .sec{padding:14px 18px 6px;font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .side .grouphdr{padding:14px 16px 10px;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.04em;
    color:var(--ink);background:linear-gradient(90deg,#e8eef6,transparent);border-top:1px solid var(--line)}
  .side .grouphdr:first-child{border-top:0;margin-top:0}
  .card.docs .tag{color:var(--teal)}
  .doclinks{display:flex;flex-wrap:wrap;gap:8px}
  .doclinks a{font-size:13px;color:#0b6b76;background:#EAFAFB;border:1px solid #BEE9ED;border-radius:8px;
    padding:6px 12px;text-decoration:none;font-weight:600;transition:.12s}
  .doclinks a:hover{background:#0EA5B7;color:#fff;border-color:#0EA5B7}
  .side .item{
    display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13.5px;color:#334155;
    border-left:3px solid transparent;transition:.12s;cursor:pointer;
  }
  .side .item:hover{background:#F1F5F9}
  .side .item.active{background:#EFF4FF;border-left-color:var(--primary);color:var(--ink);font-weight:600}
  .side .item .tick{width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;flex:none;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .side .item.done .tick{background:var(--green);border-color:var(--green)}
  .side .item.done .tick svg{display:block}
  .side .item .tick svg{display:none}
  .side .item .n{flex:1;line-height:1.25}

  /* main lesson column */
  .main{overflow-y:auto;padding:26px 34px 60px}
  .crumbs{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .main h1{font-size:29px;font-weight:800;color:var(--ink);margin:6px 0 4px;letter-spacing:-.02em}
  .lesson-meta{font-size:13.5px;color:var(--muted);margin-bottom:20px}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;
    box-shadow:0 1px 2px rgba(16,30,46,.04)}
  .card .tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .card.concept .tag{color:var(--teal)}
  .card.task .tag{color:var(--primary)}
  .card p{font-size:15px;line-height:1.6;color:#334155;margin-bottom:10px}
  .card p:last-child{margin-bottom:0}
  .card b{color:var(--ink)}
  .analogy{background:#F0FBFC;border-left:4px solid var(--teal);border-radius:8px;padding:12px 16px;margin:12px 0;
    font-size:14.5px;color:#155e63}
  .analogy b{color:#0b3f43}
  code,.k{font-family:var(--mono);font-size:13px;background:#0F1E2E;color:#8ee6ff;padding:2px 7px;border-radius:6px;
    white-space:nowrap}
  .card p code{white-space:normal}
  pre.file{background:#0B1220;color:#D7E0EA;font-family:var(--mono);font-size:12.5px;line-height:1.55;
    padding:14px 16px;border-radius:10px;overflow-x:auto;margin:12px 0;border:1px solid #1e2b3d}
  pre.file .c{color:#5B6b80}
  pre.file .kw{color:#7CC4FF}
  pre.file .st{color:#9EE493}

  .do-cmd{display:flex;align-items:center;gap:12px;background:#0F1E2E;border-radius:10px;padding:12px 14px;margin:14px 0 6px}
  .do-cmd .p{color:var(--term-green);font-family:var(--mono);font-weight:700}
  .do-cmd code{background:none;color:#e8f2ff;font-size:13.5px;padding:0;white-space:pre-wrap;flex:1}
  .do-cmd button{background:var(--primary);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:12.5px;
    font-weight:600;white-space:nowrap}
  .do-cmd button:hover{filter:brightness(1.08)}
  .steps-note{font-size:13px;color:var(--muted);margin-top:4px}

  /* issues accordion */
  .issues .tag{color:var(--amber)}
  .issue{border:1px solid #F0E2C8;background:var(--amber-soft);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .issue summary{list-style:none;cursor:pointer;padding:12px 15px;font-size:14px;font-weight:600;color:#7a5312;
    display:flex;align-items:center;gap:10px}
  .issue summary::-webkit-details-marker{display:none}
  .issue summary .err{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid #e7cfa2;color:#a4442a;
    padding:2px 8px;border-radius:5px;white-space:nowrap}
  .issue summary .chev{margin-left:auto;transition:.2s;color:#b98a3f}
  .issue[open] summary .chev{transform:rotate(90deg)}
  .issue .body{padding:0 15px 14px 15px;font-size:14px;line-height:1.55;color:#5c4a2a}
  .issue .body .lbl{font-weight:700;color:#7a5312}
  .issue .body code{background:#0F1E2E;color:#8ee6ff}

  .navrow{display:flex;gap:12px;margin-top:22px}
  .navrow button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
    padding:11px 20px;font-size:14px;font-weight:600}
  .navrow button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .navrow button.primary:hover{filter:brightness(1.07)}
  .navrow button:disabled{opacity:.4;cursor:not-allowed}
  .navrow .spacer{flex:1}

  /* terminal column */
  .term-col{background:var(--term-bg);display:flex;flex-direction:column;border-left:1px solid #06101d}
  .term-head{height:42px;display:flex;align-items:center;gap:9px;padding:0 14px;background:#0a1524;
    border-bottom:1px solid #14233a;flex:none}
  .term-head .lights{display:flex;gap:6px}
  .term-head .lights i{width:11px;height:11px;border-radius:50%;display:block}
  .term-head .lights i:nth-child(1){background:#ff5f57}
  .term-head .lights i:nth-child(2){background:#febc2e}
  .term-head .lights i:nth-child(3){background:#28c840}
  .term-head .ttl{font-family:var(--mono);font-size:12px;color:#7f92a8;margin-left:4px}
  .term-head .reset{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#9fb3c8;font-size:11.5px;padding:5px 11px;border-radius:6px;font-family:var(--mono)}
  .term-head .reset:hover{color:#fff;background:rgba(255,255,255,.12)}
  .term-body{flex:1;overflow-y:auto;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.5}
  .term-body .line{white-space:pre-wrap;word-break:break-word}
  .term-body .l-cmd{color:#fff}
  .term-body .l-cmd .pr{color:var(--term-green);font-weight:700}
  .term-body .l-cmd .pr.ctr{color:var(--term-cyan)}
  .term-body .l-ok{color:var(--term-green)}
  .term-body .l-err{color:var(--term-red)}
  .term-body .l-warn{color:var(--term-amber)}
  .term-body .l-info{color:var(--term-text)}
  .term-body .l-dim{color:var(--term-dim)}
  .term-body .l-head{color:#9fb3c8;font-weight:700}
  .term-input{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid #14233a;flex:none;background:#0a1524}
  .term-input .pr{color:var(--term-green);font-family:var(--mono);font-weight:700;font-size:13px}
  .term-input .pr.ctr{color:var(--term-cyan)}
  .term-input input{flex:1;background:none;border:0;outline:none;color:#fff;font-family:var(--mono);font-size:13px}
  .term-input input::placeholder{color:#3b4a5e}

  /* success toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--green);color:#fff;padding:13px 22px;border-radius:12px;font-size:14.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(22,163,74,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:50;
    display:flex;align-items:center;gap:10px}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .mobile-note{display:none}
  @media(max-width:1180px){
    .mobile-note{display:block;background:var(--amber-soft);border:1px solid #F0E2C8;color:#7a5312;
      border-radius:10px;padding:12px 15px;font-size:13.5px;margin-bottom:16px}
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px}
  .term-col ::-webkit-scrollbar-thumb{background:#1e2b3d}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <rect x="2" y="15" width="7" height="7" rx="1.2" fill="#38E1D6"/>
      <rect x="10" y="15" width="7" height="7" rx="1.2" fill="#2496ED"/>
      <rect x="18" y="15" width="7" height="7" rx="1.2" fill="#8ea2ff"/>
      <rect x="6" y="7" width="7" height="7" rx="1.2" fill="#2496ED"/>
      <rect x="14" y="7" width="7" height="7" rx="1.2" fill="#38E1D6"/>
      <path d="M2 24 q13 5 26 0" stroke="#4257D6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div><b>Container Lab</b><span>Learn Docker &amp; Kubernetes by doing</span></div>
  </div>
  <div class="tracks">
    <button data-track="docker" class="active" onclick="setTrack('docker')"><span class="dot"></span>Docker</button>
    <button data-track="k8s" onclick="setTrack('k8s')"><span class="dot"></span>Kubernetes</button>
  </div>
  <div class="progress-wrap">
    <a id="docsLink" href="https://docs.docker.com/" target="_blank" rel="noopener"
       style="color:#9FB3C8;font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.14);padding:6px 11px;border-radius:8px;margin-right:4px">📖 Official docs ↗</a>
    <div class="txt">Progress<br><b id="pctText">0%</b></div>
    <div class="ring">
      <svg width="40" height="40">
        <circle cx="20" cy="20" r="16" stroke="#26415e" stroke-width="4" fill="none"/>
        <circle id="ringFill" cx="20" cy="20" r="16" stroke="#38E1D6" stroke-width="4" fill="none"
          stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5"
          style="transition:stroke-dashoffset .5s ease"/>
      </svg>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
  <section class="term-col">
    <div class="term-head">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="ttl" id="termTitle">bash — container-lab</div>
      <button class="reset" onclick="resetEnv()">↻ reset env</button>
    </div>
    <div class="term-body" id="termBody"></div>
    <div class="term-input">
      <span class="pr" id="prompt">$</span>
      <input id="termInput" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter…" />
    </div>
  </section>
</div>

<div class="toast" id="toast"><span>✓</span><span id="toastMsg">Lesson complete!</span></div>

<script>
/* ============================================================
   STATE / SIMULATED ENVIRONMENT
   ============================================================ */
let state;
function freshState(){
  return {
    inContainer:null,
    dockerRunning:true,
    containers:[],           // {id,name,image,status,ports,cmd}
    images:['hello-world','nginx'],
    disk:100,                // % free (for prune demo)
    clusterUp:true,
    nodes:[{name:'minikube',status:'Ready',roles:'control-plane',age:'12d',ver:'v1.29.2'}],
    deployments:[],          // {name,image,replicas,hash,container}
    pods:[],                 // {name,dep,image,status,restarts}
    services:[],             // {name,type,clusterIP,port,nodePort,selector}
    volumes:[],              // docker volumes
    networks:[{name:'bridge',driver:'bridge'},{name:'host',driver:'host'},{name:'none',driver:'null'}],
    compose:false,           // docker compose app running
    namespaces:['default','kube-system'],
    configmaps:[], secrets:[], hpas:[],
    contexts:['minikube'], ctx:'minikube', cloud:null, // cloud: 'aws'|'azure'|'gcp'
    helmReleases:[],
    pvcs:[], statefulsets:[], daemonsets:[], jobs:[], cronjobs:[], ingresses:[],
  };
}
const GOOD_BASES=['nginx','httpd','redis','busybox','node','python','mysql','postgres','alpine','hello-world','ubuntu'];
const GOOD_TAGS=['latest','stable','alpine','1','1.25','1.27','16','20','3','3.12','7','8'];
function imageOk(img){
  let [base,tag]=img.split(':');
  if(base==='myapp' && state.images.includes('myapp')) return true;
  if(!GOOD_BASES.includes(base)) return false;
  if(tag && !GOOD_TAGS.includes(tag)) return false; // typo tag => pull fails
  return true;
}
const NAMES=['brave_wozniak','vibrant_turing','eager_lovelace','keen_hopper','jolly_kepler','wise_bardeen'];
let nameI=0;
function ctrName(){ return NAMES[(nameI++)%NAMES.length]; }
function id6(){ return Math.random().toString(16).slice(2,8); }
function rnd(n){ let s='';const c='abcdefghijklmnopqrstuvwxyz0123456789';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s; }

/* ============================================================
   OUTPUT HELPERS  (each line: {t,c})
   ============================================================ */
const L=(t,c='l-info')=>({t,c});
function table(headers,rows){
  const cols=headers.length;
  const w=headers.map((h,i)=>Math.max(h.length,...rows.map(r=>String(r[i]||'').length)));
  const fmt=r=>r.map((c,i)=>String(c||'').padEnd(w[i]+3)).join('');
  const out=[L(fmt(headers),'l-head')];
  rows.forEach(r=>out.push(L(fmt(r))));
  return out;
}

/* ============================================================
   DOCKER COMMANDS
   ============================================================ */
function docker(args){
  if(!state.dockerRunning) return [L("Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running?",'l-err')];
  const sub=args[0];
  if(['--version','-v','version'].includes(sub))
    return [L("Docker version 25.0.3, build 4debf41",'l-info')];
  if(sub==='run') return dockerRun(args.slice(1));
  if(sub==='ps') return dockerPs(args.includes('-a')||args.includes('--all'));
  if(sub==='images') return dockerImages();
  if(sub==='pull') return dockerPull(args[1]);
  if(sub==='logs') return dockerLogs(args.filter(a=>!a.startsWith('-')).pop());
  if(sub==='exec') return dockerExec(args.slice(1));
  if(sub==='stop'||sub==='start'||sub==='restart') return dockerStop(sub,args[1]);
  if(sub==='rm') return dockerRm(args.filter(a=>!a.startsWith('-')).slice(1));
  if(sub==='rmi') return dockerRmi(args[1]);
  if(sub==='build') return dockerBuild(args.slice(1));
  if(sub==='login') return [L("Login Succeeded",'l-ok'),L("(you're now authenticated to "+(args[1]||"docker.io")+" — you can push images)",'l-dim')];
  if(sub==='tag'){ if(args[2]) state.images.push(args[2].split(':')[0]); return [L("✓ Tagged "+withTag(args[1]||'?')+" as "+withTag(args[2]||'?'),'l-ok')]; }
  if(sub==='push') return dockerPush(args[1]);
  if(sub==='volume') return dockerVolume(args.slice(1));
  if(sub==='network') return dockerNetwork(args.slice(1));
  if(sub==='inspect') return dockerInspect(args[1]);
  if(sub==='stats') return dockerStats();
  if(sub==='compose') return dockerCompose(args.slice(1));
  if(sub==='system'&&args[1]==='df') return dockerDf();
  if(sub==='system'&&args[1]==='prune'){ state.disk=100; state.containers=state.containers.filter(c=>c.status==='Up');
    return [L("Deleted stopped containers and dangling images.",'l-ok'),L("Total reclaimed space: 2.4GB",'l-info')]; }
  if(sub===undefined||sub==='help'||sub==='--help')
    return [L("Usage: docker COMMAND",'l-head'),L("Common: run, ps, images, pull, build, login, push, tag, volume, network, compose, inspect, stats",'l-dim')];
  return [L("docker: '"+sub+"' is not a docker command. See 'docker --help'.",'l-err')];
}
function parseRun(a){
  const o={detached:false,ports:[],name:null,image:null,cmd:null,interactive:false,env:[],restart:null,network:null,vols:[]};
  for(let i=0;i<a.length;i++){
    const x=a[i];
    if(x==='-d'||x==='--detach') o.detached=true;
    else if(x==='-it'||x==='-i'||x==='-t'||x==='-ti') o.interactive=true;
    else if(x==='-p'||x==='--publish'){ o.ports.push(a[++i]); }
    else if(x==='--name'){ o.name=a[++i]; }
    else if(x==='-e'||x==='--env'){ o.env.push(a[++i]); }
    else if(x==='--restart'){ o.restart=a[++i]; }
    else if(x==='--network'||x==='--net'){ o.network=a[++i]; }
    else if(x==='-v'||x==='--volume'){ o.vols.push(a[++i]); }
    else if(x==='--rm'){}
    else if(!x.startsWith('-')&&!o.image){ o.image=x; }
    else if(o.image && !x.startsWith('-')){ o.cmd=(o.cmd||'')+' '+x; }
  }
  return o;
}
function dockerRun(a){
  const o=parseRun(a);
  if(!o.image) return [L("docker: 'run' requires at least 1 argument. An image name is needed.",'l-err')];
  if(o.image==='hello-world'){
    return [
      L("Unable to find image 'hello-world:latest' locally",'l-dim'),
      L("latest: Pulling from library/hello-world",'l-dim'),
      L("Status: Downloaded newer image for hello-world:latest",'l-dim'),
      L(""),L("Hello from Docker!",'l-ok'),
      L("This message shows that your installation appears to be working correctly.",'l-info'),
      L("The container printed this message and then exited — that's expected.",'l-dim'),
    ];
  }
  if(!imageOk(o.image))
    return [
      L("Unable to find image '"+withTag(o.image)+"' locally",'l-dim'),
      L("docker: Error response from daemon: pull access denied for "+o.image.split(':')[0]+
        ", repository does not exist or may require 'docker login'.",'l-err'),
      L("Tip: check the image name/tag for a typo, or run 'docker login'.",'l-warn'),
    ];
  // port conflict?
  for(const p of o.ports){
    const host=p.split(':')[0];
    const clash=state.containers.find(c=>c.status==='Up'&&c.ports.some(pp=>pp.split(':')[0]===host));
    if(clash) return [
      L("docker: Error response from daemon: driver failed programming external connectivity:",'l-err'),
      L("Bind for 0.0.0.0:"+host+" failed: port is already allocated.",'l-err'),
      L("Tip: that host port is taken by '"+clash.name+"'. Use a different one, e.g. -p "+(parseInt(host)+1)+":80",'l-warn'),
    ];
  }
  if(!state.images.includes(o.image.split(':')[0])) state.images.push(o.image.split(':')[0]);
  // auto-create referenced volume if missing

  out.push(L("✓ Container '"+name+"' started"+pmap,'l-ok'));
  if(o.env.length) out.push(L("  env set: "+o.env.join(', '),'l-dim'));
  if(o.restart) out.push(L("  restart policy: "+o.restart+" (Docker will keep it running if it crashes)",'l-dim'));

function reconcile(dep){
  let mine=state.pods.filter(p=>p.dep===dep.name);
  // remove extras
  while(mine.length>dep.replicas){ const p=mine.pop(); state.pods=state.pods.filter(x=>x!==p); }
  // add missing
  while(mine.length<dep.replicas){
    const st=imageOk(dep.image)?'Running':'ImagePullBackOff';
    const p={name:dep.name+'-'+dep.hash+'-'+rnd(5),dep:dep.name,image:dep.image,status:st,restarts:st==='Running'?0:0};
    state.pods.push(p); mine.push(p);
  }
  // update status of existing to match image validity
  mine.forEach(p=>{ p.image=dep.image; p.status=imageOk(dep.image)?'Running':'ImagePullBackOff'; });
}
function kubectl(args){

  if(op==='list'||op==='ls') return state.helmReleases.length?table(['NAME','CHART','STATUS'],state.helmReleases.map(r=>[r.name,r.chart,'deployed'])):[L("(no releases installed — try 'helm install my-web bitnami/nginx')",'l-dim')];

function provisionCluster(provider,name,ctxName){

function cloud(cmd,a){

      return [L("[ℹ] creating EKS cluster \""+n+"\" (the control plane is fully managed by AWS)",'l-dim'),
        L("[ℹ] building cluster stack, creating managed nodegroup...",'l-dim'),
        L("[✓] EKS cluster \""+n+"\" is ready — kubectl is now pointed at it.",'l-ok'),
        L("Notice: you never installed or patched the control plane. That's the ‘managed’ difference.",'l-dim')]; }
    return [L("eksctl: manage EKS clusters. Try: eksctl create cluster --name demo","l-dim")];
  }
  if(cmd==='az'){
    if(a[0]==='aks'&&a[1]==='create'){ const n=argVal(a,'--name')||argVal(a,'-n')||'my-aks';
      return [L("Creating AKS cluster '"+n+"' ... (Azure manages the control plane for free)",'l-dim'),L("✓ AKS cluster '"+n+"' created. Now run: az aks get-credentials -g <rg> -n "+n,'l-ok')]; }
    if(a[0]==='aks'&&a[1]==='get-credentials'){ const n=argVal(a,'--name')||argVal(a,'-n')||'my-aks';
      provisionCluster('azure',n,n); return [L("Merged \""+n+"\" as current context in ~/.kube/config",'l-ok'),L("kubectl now talks to your managed AKS cluster.",'l-dim')]; }
    return [L("az aks: manage Azure Kubernetes Service. Try: az aks create -g rg -n demo, then az aks get-credentials -g rg -n demo","l-dim")];
  }
  if(cmd==='gcloud'){
    if(a[0]==='container'&&a[1]==='clusters'&&a[2]==='create'){ const n=a[3]||'my-gke';
      return [L("Creating cluster "+n+" ... (GKE manages the control plane)",'l-dim'),L("✓ Cluster "+n+" created. Now run: gcloud container clusters get-credentials "+n,'l-ok')]; }
    if(a[0]==='container'&&a[1]==='clusters'&&a[2]==='get-credentials'){ const n=a[3]||'my-gke';
      provisionCluster('gcp',n,'gke_'+n); return [L("Fetching cluster endpoint and auth data.",'l-dim'),L("kubeconfig entry generated for "+n+".",'l-ok')]; }
    if(a[0]==='run'&&a[1]==='deploy'){ const n=a[2]||'my-svc';
      return [L("Deploying container to Cloud Run service ["+n+"]...",'l-dim'),L("✓ Service ["+n+"] deployed and serving 100% of traffic.",'l-ok'),
        L("Service URL: https://"+n+"-"+rnd(6)+"-uc.a.run.app  (fully managed — no servers, scales to zero).",'l-info')]; }
    return [L("gcloud: Google Cloud CLI. Try: gcloud container clusters create demo","l-dim")];
  }
  if(cmd==='aws'){
    if(a[0]==='eks'&&a[1]==='update-kubeconfig'){ const n=argVal(a,'--name')||'my-cluster';
      provisionCluster('aws',n,'arn:aws:eks:'+n); return [L("Added new context arn:aws:eks:us-east-1:...:cluster/"+n+" to ~/.kube/config",'l-ok'),L("kubectl now talks to your managed EKS cluster.",'l-dim')]; }
    if(a[0]==='ecr'&&a[1]==='create-repository') return [L('{ "repository": { "repositoryUri": "1234.dkr.ecr.us-east-1.amazonaws.com/'+ (argVal(a,'--repository-name')||'myapp') +'" } }','l-info'),L("✓ Managed registry (ECR) repo created. Push images here instead of your own server.",'l-ok')];
    if(a[0]==='ecr'&&a[1]==='get-login-password') return [L("<auth-token>",'l-dim'),L("Pipe this into 'docker login' to push to ECR: aws ecr get-login-password | docker login --username AWS --password-stdin <uri>",'l-dim')];
    return [L("aws: AWS CLI. Try: aws eks update-kubeconfig --name demo","l-dim")];
  }
  return [L(cmd+": not recognized in this lab.",'l-err')];
}

function runCommand(raw){
  const cmd=raw.trim();

  if(state.inContainer){ print(insideShell(cmd)); return finish(cmd); }
  if(cmd===''){ return; }
  if(cmd==='clear'||cmd==='cls'){ document.getElementById('termBody').innerHTML=''; return; }
  if(cmd==='reset'){ resetEnv(); return; }
  if(cmd==='help'){ print([L("This is a simulated shell for learning.",'l-head'),
    L("Try Docker (docker run, docker ps, ...) or Kubernetes (kubectl get pods, ...) commands.",'l-info'),
    L("'clear' to clear • '↻ reset env' to start fresh.",'l-dim')]); return; }
  const parts=cmd.split(/\s+/);
  let out;
  if(parts[0]==='docker') out=docker(parts.slice(1));
  else if(parts[0]==='kubectl'||parts[0]==='k') out=kubectl(parts.slice(1));
  else if(parts[0]==='helm') out=helm(parts.slice(1));
  else if(['eksctl','az','gcloud','aws'].includes(parts[0])) out=cloud(parts[0],parts.slice(1));
  else if(parts[0]==='minikube'){ out=[L(cmd.includes('start')?"minikube: cluster already running ✓":"minikube v1.32 — the local self-managed cluster is simulated and already up.",'l-ok')]; }
  else if(['ls','pwd','whoami','cd','echo'].includes(parts[0])) out=[L("This lab focuses on container commands. Try docker / kubectl / helm, or a cloud CLI (eksctl, az, gcloud). Type 'help'.",'l-dim')];
  else out=[L(parts[0]+": command not found",'l-err'),L("Try docker, kubectl, helm, or a cloud CLI (eksctl/az/gcloud/aws). Type 'help'.",'l-dim')];
  print(out);
  finish(cmd);
}
function finish(cmd){
  updatePrompt();
  const lesson=LESSONS[cur];
  if(lesson && !lesson.done && lesson.check){
    try{ if(lesson.check(cmd.trim().replace(/\s+/g,' '), state)){ complete(cur); } }catch(e){}
  }
}

function echo(raw){
  const b=document.getElementById('termBody');
  const div=document.createElement('div');
  div.className='line l-cmd';
  const pr=state.inContainer?('root@'+state.inContainer.id+':/# '):'$ ';
  div.innerHTML='<span class="pr'+(state.inContainer?' ctr':'')+'">'+pr+'</span>'+escapeHtml(raw);
  b.appendChild(div); b.scrollTop=b.scrollHeight;
}
function print(lines){
  const b=document.getElementById('termBody');
  lines.forEach(l=>{ const d=document.createElement('div'); d.className='line '+l.c; d.textContent=l.t; b.appendChild(d); });
  b.scrollTop=b.scrollHeight;
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function updatePrompt(){
  const pr=document.getElementById('prompt');
  if(state.inContainer){ pr.textContent='root@'+state.inContainer.id+':/#'; pr.className='pr ctr'; }
  else { pr.textContent='$'; pr.className='pr'; }
}
function resetEnv(){
  state=freshState(); nameI=0;
  document.getElementById('termBody').innerHTML='';
  print([L("Environment reset. A machine with Docker + a local (self-managed) Kubernetes cluster is ready.",'l-ok'),
    L("Practice any command: docker · kubectl · helm · or cloud CLIs (eksctl, az, gcloud, aws). Type 'help' anytime.",'l-dim')]);
  updatePrompt();
}

 docs:[['Labels &amp; selectors','https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/']],issues:[]},

{track:T,group:G,sec:'Organization',title:'Namespaces',
 concept:`<p><b>Namespaces</b> split one cluster into isolated areas (dev / staging / prod, or per-team), so names and resources don’t collide. Target one with <code>-n &lt;ns&gt;</code>.</p>`,
 task:`<p>Create a namespace:</p>`,cmd:'kubectl create namespace dev',check:(c,s)=>s.namespaces.includes('dev'),
 docs:[['Namespaces','https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/']],issues:[]},

{track:T,group:G,sec:'Networking',title:'Services: ClusterIP / NodePort / LoadBalancer',
 concept:`<p>Pods get new IPs as they come and go, so you never talk to them directly. A <b>Service</b> is a stable address. <b>ClusterIP</b> = internal only; <b>NodePort</b> = opens a port on every node; <b>LoadBalancer</b> = asks the cloud for an external IP (stays pending on-prem).</p>`,
 task:`<p>Expose your deployment on a NodePort:</p>`,cmd:'kubectl expose deployment nginx --port=80 --type=NodePort',check:(c,s)=>s.services.some(x=>x.name==='nginx'),
 docs:[['Services','https://kubernetes.io/docs/concepts/services-networking/service/']],
 issues:[{p:'Service has no endpoints',c:'Selector doesn’t match Pod labels.',f:'Make the Service selector equal the Pod labels.'},
   {p:'Can’t reach it from my browser',c:'ClusterIP is internal.',f:'Use NodePort/LoadBalancer, or <code>kubectl port-forward</code>.'}]},

{track:T,group:G,sec:'Networking',title:'Ingress',
 concept:`<p>A <b>Service</b> exposes one app; an <b>Ingress</b> is a smart HTTP router in front of many Services — routing by hostname/path and handling TLS. It needs an <b>ingress controller</b> (e.g. nginx-ingress) running in the cluster.</p>`,
 task:`<p>Apply the sample ingress:</p>`,cmd:'kubectl apply -f ingress.yaml',check:(c,s)=>s.ingresses.includes('web-ingress'),
 docs:[['Ingress','https://kubernetes.io/docs/concepts/services-networking/ingress/']],
 issues:[{p:'Ingress ADDRESS stays empty',c:'No ingress controller installed.',f:'Install one (e.g. ingress-nginx) — the controller does the actual routing.'}]},

{track:T,group:G,sec:'Configuration',title:'ConfigMaps',
 concept:`<p>Keep configuration out of your image with a <b>ConfigMap</b> — non-secret key/values pods read as env vars or files. Change config without rebuilding.</p>`,
 task:`<p>Create a config map:</p>`,cmd:'kubectl create configmap app-config --from-literal=MODE=prod',check:(c,s)=>s.configmaps.some(x=>x.name==='app-config'),
 docs:[['ConfigMaps','https://kubernetes.io/docs/concepts/configuration/configmap/']],issues:[]},

{track:T,group:G,sec:'Configuration',title:'Secrets',
 concept:`<p><b>Secrets</b> are like ConfigMaps but for sensitive values (passwords, tokens) — base64-encoded and access-controlled. Never bake secrets into images.</p>`,
 task:`<p>Create a secret:</p>`,cmd:'kubectl create secret generic db-pass --from-literal=password=s3cret',check:(c,s)=>s.secrets.some(x=>x.name==='db-pass'),
 docs:[['Secrets','https://kubernetes.io/docs/concepts/configuration/secret/']],
 issues:[{p:'Is base64 secure?',c:'It’s encoding, not encryption.',f:'Enable encryption-at-rest for etcd and restrict access with RBAC; consider an external secrets manager.'}]},

{track:T,group:G,sec:'Storage',title:'Volumes, PV, PVC &amp; StorageClass',
 concept:`<p>Pods are ephemeral, so stateful apps need storage that outlives them. A <b>PersistentVolumeClaim (PVC)</b> requests storage; a <b>StorageClass</b> provisions a <b>PersistentVolume</b> automatically to satisfy it.</p>`,
 task:`<p>Apply the sample PVC:</p>`,cmd:'kubectl apply -f pvc.yaml',check:(c,s)=>s.pvcs.includes('data-pvc'),
 docs:[['Volumes','https://kubernetes.io/docs/concepts/storage/volumes/'],['Persistent Volumes','https://kubernetes.io/docs/concepts/storage/persistent-volumes/'],['StorageClasses','https://kubernetes.io/docs/concepts/storage/storage-classes/']],
 issues:[{p:'PVC stuck Pending',c:'No StorageClass or no capacity.',f:'Ensure a default StorageClass exists (or one that can provision).'}]},

{track:T,group:G,sec:'Scaling',title:'Scale up',
 concept:`<p>Handle more traffic by asking for more copies. K8s creates the extra Pods and load-balances across them.</p>`,
 task:`<p>Scale nginx to 3 replicas:</p>`,cmd:'kubectl scale deployment nginx --replicas=3',check:(c,s)=>s.deployments.some(d=>d.name==='nginx'&&d.replicas>=3),
 docs:[['Scaling a Deployment','https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#scaling-a-deployment']],
 issues:[{p:'Pods Pending after scaling',c:'Not enough CPU/memory.',f:'Add capacity or lower resource requests.'}]},

{track:T,group:G,sec:'Scaling',title:'Autoscaling (HPA)',
 concept:`<p>The <b>Horizontal Pod Autoscaler</b> adds/removes pods automatically based on load (e.g. CPU %). You set the min, max, and target — K8s does the rest. Needs the metrics-server.</p>`,
 task:`<p>Autoscale nginx between 2 and 5 pods at 70% CPU:</p>`,cmd:'kubectl autoscale deployment nginx --min=2 --max=5 --cpu-percent=70',check:(c,s)=>s.hpas.some(h=>h.dep==='nginx'),
 docs:[['Horizontal Pod Autoscaling','https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/']],
 issues:[{p:'HPA shows targets <unknown>',c:'No metrics-server.',f:'Install metrics-server so the HPA can read CPU/memory.'}]},

{track:T,group:G,sec:'Reliability',title:'Health probes',
 concept:`<p>Probes tell K8s if a container is OK: <b>liveness</b> (restart if stuck), <b>readiness</b> (only send traffic when ready), <b>startup</b> (grace period for slow starters). Without them, a hung app keeps getting traffic.</p>`,
 task:`<p>Concept — continue.</p>`,
 docs:[['Liveness/readiness/startup probes','https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/']],issues:[]},

{track:T,group:G,sec:'Reliability',title:'Resource requests &amp; limits',
 concept:`<p><b>Requests</b> = what a pod is guaranteed (used for scheduling). <b>Limits</b> = the ceiling (exceed memory → OOMKilled). Setting these keeps the cluster stable and fair.</p>`,
 task:`<p>Concept — continue.</p>`,
 docs:[['Manage resources for containers','https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/']],issues:[]},

{track:T,group:G,sec:'Reliability',title:'Self-healing',
 concept:`<p>Delete a Pod that belongs to a Deployment and K8s recreates it instantly — because you declared how many you want. This is the restaurant-manager idea in action.</p>`,
 task:`<p>Copy a Pod NAME from <code>kubectl get pods</code>, delete it, then list again:</p>`,cmd:'kubectl delete pod <pod-name>',check:m(/^kubectl delete pods? \S+/),
 docs:[['ReplicaSet (self-healing)','https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/']],
 issues:[{p:'Count didn’t drop',c:'That’s the point — it healed.',f:'To reduce count, scale down or delete the Deployment.'}]},

{track:T,group:G,sec:'Updates',title:'Rollouts &amp; rollbacks',
 concept:`<p>Deployments update pods gradually (a <b>rolling update</b>) for zero downtime, and remember history so you can <b>roll back</b> instantly if a release goes bad.</p>`,
 task:`<p>Roll back the nginx deployment to the previous version:</p>`,cmd:'kubectl rollout undo deployment/nginx',check:m(/^kubectl rollout (undo|status) /),
 docs:[['Rolling updates &amp; rollback','https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment']],issues:[]},

{track:T,group:G,sec:'Declarative',title:'Config from YAML manifests',
 concept:`<p>Real teams store desired state in <b>YAML</b> in Git, then <code>kubectl apply -f</code> it (GitOps). Declarative, reviewable, repeatable.</p><pre class="file"><span class="kw">apiVersion:</span> apps/v1
<span class="kw">kind:</span> Deployment
<span class="kw">metadata:</span> { <span class="kw">name:</span> web }
<span class="kw">spec:</span> { <span class="kw">replicas:</span> 3, ... }</pre>`,
 task:`<p>Apply the sample manifest:</p>`,cmd:'kubectl apply -f nginx-deploy.yaml',check:(c,s)=>s.deployments.some(d=>d.name==='web'),
 docs:[['Declarative management','https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/']],
 issues:[{p:'unknown field / validation error',c:'YAML typo or indentation.',f:'<code>kubectl apply --dry-run=client -f file</code> to validate.'}]},

{track:T,group:G,sec:'Workloads',title:'Workload types: StatefulSet, DaemonSet, Job, CronJob',
 concept:`<p>Beyond Deployments: <b>StatefulSet</b> (stable identity + storage, for databases), <b>DaemonSet</b> (one pod per node, for agents), <b>Job</b> (run once to completion), <b>CronJob</b> (on a schedule).</p>`,
 task:`<p>Apply a StatefulSet:</p>`,cmd:'kubectl apply -f statefulset.yaml',check:(c,s)=>s.statefulsets.includes('db'),
 docs:[['StatefulSet','https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/'],['DaemonSet','https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/'],['Jobs','https://kubernetes.io/docs/concepts/workloads/controllers/job/'],['CronJob','https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/']],issues:[]},

{track:T,group:G,sec:'Troubleshooting',title:'Debugging: describe, logs, exec, port-forward',
 concept:`<p>Your toolkit: <code>describe</code> shows <b>events</b> (why it won’t start), <code>logs</code> shows what the app said (why it crashed), <code>exec</code> gets you a shell inside, <code>port-forward</code> lets you reach a pod locally.</p>`,
 task:`<p>Describe one of your pods (copy its name):</p>`,cmd:'kubectl describe pod <pod-name>',check:m(/^kubectl (describe pods? \S+|logs \S+)/),
 docs:[['Debug running pods','https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/'],['Port forwarding','https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/']],
 issues:[{p:'CrashLoopBackOff',c:'App starts, errors, exits, repeat.',f:'Read <code>kubectl logs</code>; usually bad config/env.'},
   {p:'OOMKilled',c:'Over memory limit.',f:'Raise the memory limit or fix the leak.'}]},

{track:T,group:G,sec:'Packaging',title:'Helm (package manager)',
 concept:`<p><b>Helm</b> is “apt/npm for Kubernetes.” A <b>chart</b> bundles all the YAML for an app; one <code>helm install</code> deploys the whole thing (Deployment + Service + config) with configurable values.</p>`,
 task:`<p>Install a chart as a release:</p>`,cmd:'helm install my-web bitnami/nginx',check:(c,s)=>s.helmReleases.length>0,
 docs:[['Helm docs','https://helm.sh/docs/']],issues:[]},

{track:T,group:G,sec:'Security',title:'RBAC &amp; Network Policies',
 concept:`<p><b>RBAC</b> controls <i>who</i> can do <i>what</i> (Roles + RoleBindings, tied to users/ServiceAccounts). <b>Network Policies</b> control which pods may talk to which — default-deny is a strong baseline for a bank.</p>`,
 task:`<p>Concept — continue.</p>`,
 docs:[['RBAC','https://kubernetes.io/docs/reference/access-authn-authz/rbac/'],['Service accounts','https://kubernetes.io/docs/concepts/security/service-accounts/'],['Network Policies','https://kubernetes.io/docs/concepts/services-networking/network-policies/']],issues:[]},

{track:T,group:G,sec:'Troubleshooting',title:'🔧 Challenge: fix ImagePullBackOff',
 concept:`<p>The most common real K8s error. Deploy with a typo’d image tag, watch it get stuck, diagnose with <code>describe</code>, and fix it.</p>`,
 task:`<p>1) <code>kubectl create deployment web2 --image=nginx:latst</code><br>2) <code>kubectl get pods</code> → ImagePullBackOff<br>3) <code>kubectl describe pod &lt;web2-pod&gt;</code> (read Events)<br>4) fix: <code>kubectl set image deployment/web2 web2=nginx:latest</code></p>`,
 cmd:'kubectl create deployment web2 --image=nginx:latst',
 check:(c,s)=>{const d=s.deployments.find(x=>x.name==='web2');return d&&imageOk(d.image)&&s.pods.some(p=>p.dep==='web2'&&p.status==='Running');},
 docs:[['Debug: ImagePullBackOff','https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/']],
 issues:[{p:'ImagePullBackOff / ErrImagePull',c:'Wrong image name/tag.',f:'<code>kubectl set image deployment/web2 web2=nginx:latest</code>.'},
   {p:'Still failing on a private image',c:'Missing registry credentials.',f:'Create an imagePullSecret and reference it.'}]},
];}

function _kCloud(){ const T='k8s',G='cloud'; return [
{track:T,group:G,sec:'Managed',title:'Managed vs self-managed',
 concept:`<p>With <b>managed Kubernetes</b> (EKS on AWS, AKS on Azure, GKE on Google), the cloud runs and patches the <b>control plane</b> for you — you just manage your apps and (usually) the worker nodes. Self-managed = you run everything, including the control plane and etcd backups.</p><div class="analogy">Self-managed = you maintain the engine. Managed = you drive; the manufacturer maintains the engine.</div>`,
 task:`<p>Concept — continue.</p>`,
 docs:[['Amazon EKS','https://docs.aws.amazon.com/eks/'],['Azure AKS','https://learn.microsoft.com/azure/aks/'],['Google GKE','https://cloud.google.com/kubernetes-engine/docs']],issues:[]},

{track:T,group:G,sec:'Managed',title:'Create a managed cluster',
 concept:`<p>One command provisions a production-ready cluster with a managed control plane. Notice you never install or patch the control plane — that’s the value.</p>`,
 task:`<p>Create a managed EKS cluster (or try <code>az aks create</code> / <code>gcloud container clusters create</code>):</p>`,cmd:'eksctl create cluster --name demo',check:(c,s)=>s.cloud!==null,
 docs:[['eksctl','https://eksctl.io/'],['az aks create','https://learn.microsoft.com/azure/aks/learn/quick-kubernetes-deploy-cli'],['GKE quickstart','https://cloud.google.com/kubernetes-engine/docs/deploy-app-cluster']],
 issues:[{p:'kubectl can’t reach the new cluster',c:'kubeconfig not updated.',f:'<code>aws eks update-kubeconfig --name demo</code> (or <code>az aks get-credentials</code> / <code>gcloud … get-credentials</code>).'}]},

{track:T,group:G,sec:'Managed',title:'Cloud LoadBalancer gets a real IP',
 concept:`<p>Here’s a concrete difference: on a managed cluster, a <code>type=LoadBalancer</code> Service makes the cloud provision a real external load balancer and hand you an <b>EXTERNAL-IP</b>. On-prem it stays <code>&lt;pending&gt;</code> because there’s no cloud LB.</p>`,
 task:`<p>After creating a cloud cluster: deploy, expose as LoadBalancer, then check svc:<br><code>kubectl create deployment web --image=nginx</code><br><code>kubectl expose deployment web --port=80 --type=LoadBalancer</code><br><code>kubectl get svc</code></p>`,
 cmd:'kubectl expose deployment web --port=80 --type=LoadBalancer',
 check:(c,s)=>s.cloud&&s.services.some(x=>x.type==='LoadBalancer'),
 docs:[['LoadBalancer Services','https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer']],
 issues:[{p:'EXTERNAL-IP stuck <pending>',c:'On-prem, or no cloud LB integration.',f:'On bare metal use MetalLB or an ingress; in cloud ensure the cloud-controller is enabled.'}]},

{track:T,group:G,sec:'Managed',title:'Node pools &amp; cluster autoscaling',
 concept:`<p>Managed clusters group workers into <b>node pools</b> (e.g. a cheap pool + a GPU pool). The <b>cluster autoscaler</b> adds/removes <i>nodes</i> when pods can’t be scheduled or nodes sit idle — complementing the HPA, which scales <i>pods</i>.</p>`,
 task:`<p>Concept — continue.</p>`,
 docs:[['Cluster autoscaling','https://kubernetes.io/docs/concepts/cluster-administration/cluster-autoscaling/'],['EKS managed node groups','https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html']],issues:[]},

{track:T,group:G,sec:'Managed',title:'Managed registries &amp; cloud IAM',
 concept:`<p>In the cloud, image pulls and permissions use <b>cloud IAM</b>, not passwords. Workloads assume an identity (AWS <b>IRSA</b>, GKE <b>Workload Identity</b>, Azure workload identity) to pull from the managed registry (ECR/GAR/ACR) and access other cloud services securely.</p>`,
 task:`<p>Concept — continue. Prep a managed registry with <code>aws ecr create-repository --repository-name myapp</code>.</p>`,
 docs:[['IAM roles for service accounts (IRSA)','https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html'],['GKE Workload Identity','https://cloud.google.com/kubernetes-engine/docs/concepts/workload-identity']],issues:[]},
];}

/* ============================================================
   APP WIRING
   ============================================================ */
let LESSONS_ALL=[], LESSONS=[], cur=0, curTrack='docker';
function boot(){
  LESSONS_ALL=buildLessons();
  LESSONS_ALL.forEach(l=>l.done=false);
  state=freshState();
  setTrack('docker',true);
  resetEnv();
  const inp=document.getElementById('termInput');
  let hist=[],hi=-1;
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ const v=inp.value; if(v.trim())hist.push(v); hi=hist.length; runCommand(v); inp.value=''; }
    else if(e.key==='ArrowUp'){ if(hi>0){hi--;inp.value=hist[hi];} e.preventDefault(); }
    else if(e.key==='ArrowDown'){ if(hi<hist.length-1){hi++;inp.value=hist[hi];}else{hi=hist.length;inp.value='';} e.preventDefault(); }
  });
  document.querySelector('.term-body').addEventListener('click',()=>inp.focus());
}
function setTrack(t,silent){
  curTrack=t;
  document.querySelectorAll('.tracks button').forEach(b=>b.classList.toggle('active',b.dataset.track===t));
  const dl=document.getElementById('docsLink'); if(dl) dl.href = t==='docker'?'https://docs.docker.com/':'https://kubernetes.io/docs/home/';
  LESSONS=LESSONS_ALL.filter(l=>l.track===t);
  // map cur into this track: first not-done, else 0
  const firstUndone=LESSONS.findIndex(l=>!l.done);
  cur=firstUndone>=0?firstUndone:0;
  renderSide(); renderLesson();
}
function renderSide(){
  const side=document.getElementById('side'); side.innerHTML='';
  let lastSec=null,lastGroup=null;
  LESSONS.forEach((l,i)=>{
    if(l.group!==lastGroup){
      const g=document.createElement('div'); g.className='grouphdr';
      g.innerHTML=(l.group==='cloud'?'☁ Cloud &middot; Managed':'🖥 Self-managed &middot; On-prem');
      side.appendChild(g); lastGroup=l.group; lastSec=null;
    }
    if(l.sec!==lastSec){ const s=document.createElement('div'); s.className='sec'; s.textContent=l.sec; side.appendChild(s); lastSec=l.sec; }
    const d=document.createElement('div'); d.className='item'+(i===cur?' active':'')+(l.done?' done':'');
    d.innerHTML='<span class="tick"><svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6l3 3 5-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="n">'+l.title+'</span>';
    d.onclick=()=>{cur=i;renderSide();renderLesson();};
    side.appendChild(d);
  });
  updateProgress();
}
function renderLesson(){
  const l=LESSONS[cur]; const main=document.getElementById('main');
  const total=LESSONS.length;
  let html=`<div class="crumbs">${l.group==='cloud'?'☁ Cloud · Managed':'🖥 Self-managed · On-prem'} — ${l.sec}</div><h1>${l.title}</h1>
    <div class="lesson-meta">Lesson ${cur+1} of ${total} · ${curTrack==='docker'?'Docker':'Kubernetes'} track</div>`;
  html+=`<div class="mobile-note">The interactive terminal is hidden on small screens. Open this on a wider window (or desktop) to type commands. You can still read every lesson here.</div>`;
  html+=`<div class="card concept"><span class="tag">● Concept</span>${l.concept}</div>`;
  html+=`<div class="card task"><span class="tag">▶ Your turn</span>${l.task||''}`;
  if(l.cmd){
    html+=`<div class="do-cmd"><span class="p">$</span><code>${l.cmd.replace(/</g,'&lt;')}</code>
      <button onclick="runSuggested()">Run it ▸</button></div>
      <div class="steps-note">Type it yourself in the terminal, or click “Run it”. ${l.check?'Finish the task to unlock the tick.':''}</div>`;
  } else {
    html+=`<div class="steps-note" style="margin-top:6px">This is a concept step — read it, then continue.</div>`;
  }
  html+=`</div>`;
  if(l.docs&&l.docs.length){
    html+=`<div class="card docs"><span class="tag">📖 Official docs — read more if you get stuck</span><div class="doclinks">`;
    l.docs.forEach(d=>{ html+=`<a href="${d[1]}" target="_blank" rel="noopener">${d[0]} ↗</a>`; });
    html+=`</div></div>`;
  }
  if(l.issues&&l.issues.length){
    html+=`<div class="card issues"><span class="tag">⚠ Real-world issues &amp; fixes</span>`;
    l.issues.forEach(is=>{
      html+=`<details class="issue"><summary><span class="err">${is.p}</span><span class="chev">▸</span></summary>
        <div class="body"><span class="lbl">Why it happens:</span> ${is.c}<br><span class="lbl">Fix:</span> ${is.f}</div></details>`;
    });
    html+=`</div>`;
  }
  html+=`<div class="navrow">
    <button onclick="prevLesson()" ${cur===0?'disabled':''}>← Previous</button>
    <div class="spacer"></div>`;
  if(!l.cmd) html+=`<button class="primary" onclick="complete(${cur},true)">Got it — continue →</button>`;
  else html+=`<button onclick="nextLesson()" ${cur===total-1?'disabled':''}>Skip / Next →</button>`;
  html+=`</div>`;
  main.innerHTML=html; main.scrollTop=0;
}
function runSuggested(){
  const l=LESSONS[cur]; if(!l.cmd)return;
  const inp=document.getElementById('termInput');
  const first=l.cmd.split('\n')[0];
  runCommand(first);
  inp.focus();
}
function complete(globalOrLocal,advance){
  // called with local index from render; find lesson object
  const l=LESSONS[cur];
  if(!l) return;
  if(!l.done){ l.done=true; showToast(); }
  renderSide();
  if(advance){ if(cur<LESSONS.length-1){cur++;} renderSide(); renderLesson(); }
  else renderSide();
}
function nextLesson(){ if(cur<LESSONS.length-1){cur++;renderSide();renderLesson();} }
function prevLesson(){ if(cur>0){cur--;renderSide();renderLesson();} }
function updateProgress(){
  const done=LESSONS_ALL.filter(l=>l.done).length, tot=LESSONS_ALL.length;
  const pct=Math.round(done/tot*100);
  document.getElementById('pctText').textContent=pct+'%';
  const circ=2*Math.PI*16;
  document.getElementById('ringFill').style.strokeDasharray=circ;
  document.getElementById('ringFill').style.strokeDashoffset=circ-(circ*pct/100);
}
let toastT;
function showToast(){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent='Nice! Lesson complete.';
  t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
boot();
</script>
